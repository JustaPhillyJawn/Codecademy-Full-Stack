<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PokeAPI</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="index.ts" type="module"></script>
  </head>
  <body>
    <div id="content-box">
      <!-- Left Side, display pokemon info-->
      <div id="left-side">
        <div id="pokemon-info">
          <h1 id="pokemon-name">Pokemon Name</h1>
          <img id="pokemon-image" src="" alt="Pokemon Image" />
          <p id="pokemon-description">Pokemon Description</p>
        </div>
        <div id="right-side">
          <!-- Right Side, display additional info -->
          <div id="additional-info">
            <h2>Additional Info</h2>
            <p id="pokemon-type">Type: </p>
            <p id="pokemon-abilities">Abilities: </p>
            <p id="pokemon-stats">Stats: </p>
        </div>
        <p class="help-text">Example: pikachu, charizard, 25, 150</p>
      </section>

      <section class="pokemon-info" id="pokemonInfo">
        <div class="empty-state">Search for a Pokémon to see its info card.</div>
      </section>
    </main>
  </div>
  <script src="index.js"></script>
</body>
</html>
