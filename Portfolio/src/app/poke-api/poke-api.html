<!-- PokeDex component template (fragment) -->
<div class="wrapper">
    <div class="search-row">
        <input
            #pokeInput
            placeholder="Enter Pokemon Name/Number" />
        <button class="btn" (click)="searchClick(pokeInput.value)">Enter</button>
    </div>

    <div class="results">
        <div *ngFor="let pokemon of pokeService.pokemons; let i = index; trackBy: trackByIndex" class="card">
            <div class="card-top">
                <img class="sprite" [src]="pokemon.image" [alt]="pokemon.name + ' sprite'" *ngIf="pokemon.image" />
                <div class="card-info">
                    <p class="name">{{ pokemon.name }}</p>
                    <div class="types">
                        <span class="type-badge" *ngFor="let t of pokemon.types">{{ t }}</span>
                    </div>
                </div>
            </div>

            <div class="attacks">
                <strong>Attacks</strong>
                <ul>
                    <li *ngFor="let m of pokemon.moves">{{ m }}</li>
                </ul>
            </div>
        </div>
    </div>
</div>
